name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automation Hardware Asset Tracking and Maintenance Management System/asset-management-system

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Automation Hardware Asset Tracking and Maintenance Management System/asset-management-system/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run tests
        env:
          APP_ENV: development
          SECRET_KEY: ci-test-secret
          SEED_DEMO_DATA: "false"
        run: python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t it-asset-tracker:ci .
