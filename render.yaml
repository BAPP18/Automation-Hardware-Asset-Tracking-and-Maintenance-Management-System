services:
  - type: web
    name: it-asset-tracker
    runtime: python
    plan: free
    region: oregon
    rootDir: Automation Hardware Asset Tracking and Maintenance Management System/asset-management-system
    buildCommand: "pip install -r requirements.txt && pip install gunicorn"
    startCommand: "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "true"